services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      - PORT=3000
      - DATABASE_PATH=/app/data/inventory.sqlite
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL}
      - JWT_SECRET=${JWT_SECRET}
      - FRONTEND_URL=${FRONTEND_URL}
      - ALLOWED_GOOGLE_EMAIL=${ALLOWED_GOOGLE_EMAIL}
    volumes:
      - api-data:/app/data
    expose:
      - "3000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - default
      - edge
    labels:
      - traefik.enable=true
      - traefik.docker.network=edge
      - traefik.http.routers.collectible.rule=Host(`collectible.nicolaspotel.dev`)
      - traefik.http.routers.collectible.entrypoints=websecure
      - traefik.http.routers.collectible.tls.certresolver=le
      - traefik.http.services.collectible.loadbalancer.server.port=80

networks:
  default: {}
  edge:
    external: true

volumes:
  api-data:
